services:
  db:
    image: postgres:16-alpine
    container_name: mundial_db
    environment:
      POSTGRES_DB: worldcup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worldcup"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mundial_net

  app1:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/worldcup
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mundial_net

  app2:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/worldcup
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mundial_net

  app3:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/worldcup
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mundial_net

  nginx:
    image: nginx:1.27-alpine
    container_name: mundial_lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - mundial_net

volumes:
  postgres_data:

networks:
  mundial_net:
    driver: bridge
